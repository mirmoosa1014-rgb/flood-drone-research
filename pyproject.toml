[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "flood-drone-workbench"
version = "1.0.0"
description = "Synthetic flood-crossing research and passive telemetry workbench"
requires-python = ">=3.11"
[tool.setuptools.packages.find]
include = ["flood_drone*"]
